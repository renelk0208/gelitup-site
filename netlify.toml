[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  VITE_ENABLE_PORTAL = "true"
  VITE_EMAIL_WEBHOOK_URL = "https://veyxwtdntcfsvldmrthc.functions.supabase.co/b2b-email-notifications"
  VITE_EMAIL_FROM = "distributors@gelitup.com"
  VITE_EMAIL_REPLY_TO = "distribution@gelitup.com"
  VITE_B2B_ORDER_INBOX = "leeukopf@gmail.com"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "https://gelitup.netlify.app/*"
  to = "https://gelitup.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gelitup.com/*"
  to = "https://gelitup.com/:splat"
  status = 301
  force = true

# www.gelitup.eu → gelitup.eu (keep www canonical)

[[redirects]]
  from = "https://gelitup.eu/*"
  to = "https://gelitup.eu/:splat"
  status = 200
  force = false

[[redirects]]
  from = "https://www.gelitup.eu/*"
  to = "https://gelitup.eu/:splat"
  status = 301
  force = true

# Prevent iOS from caching the service worker or app shell
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# Prevent portal and admin routes from being indexed by search engines
[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin-login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
