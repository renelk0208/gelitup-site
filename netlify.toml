[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  VITE_ENABLE_PORTAL = "true"
  VITE_EMAIL_WEBHOOK_URL = "https://veyxwtdntcfsvldmrthc.functions.supabase.co/b2b-email-notifications"
  VITE_EMAIL_FROM = "GEL.IT.UP Distributors <distributors@gelitup.com>"
  VITE_EMAIL_REPLY_TO = "distribution@gelitup.com"
  VITE_B2B_ORDER_INBOX = "leeukopf@gmail.com"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "https://gelitup.netlify.app/*"
  to = "https://gelitup.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gelitup.com/*"
  to = "https://gelitup.com/:splat"
  status = 301
  force = true

# Prevent iOS from caching the service worker or app shell
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# Prevent portal and admin routes from being indexed by search engines
[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin-login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Legacy Shopify URL redirects — send old store paths to current React pages
# These clean up Google's index of old URLs from the previous Shopify store

[[redirects]]
  from = "/*/products/*"
  to = "/full-catalogue"
  status = 301

[[redirects]]
  from = "/*/collections/*"
  to = "/full-catalogue"
  status = 301

[[redirects]]
  from = "/products/*"
  to = "/full-catalogue"
  status = 301

[[redirects]]
  from = "/collections/*"
  to = "/full-catalogue"
  status = 301

[[redirects]]
  from = "/*/pages/contact*"
  to = "/pages/contact-us"
  status = 301

[[redirects]]
  from = "/*/pages/about*"
  to = "/pages/about-us"
  status = 301

[[redirects]]
  from = "/*/contact"
  to = "/pages/contact-us"
  status = 301

[[redirects]]
  from = "/*/contact/"
  to = "/pages/contact-us"
  status = 301

# Only redirect the bare Shopify versions — NOT /pages/contact-us or /pages/about-us
# (those are valid React routes and must not be redirected)
[[redirects]]
  from = "/pages/contact"
  to = "/pages/contact-us"
  status = 301

[[redirects]]
  from = "/pages/about"
  to = "/pages/about-us"
  status = 301

[[redirects]]
  from = "/blogs/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/*/blogs/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/cart"
  to = "/full-catalogue"
  status = 301

[[redirects]]
  from = "/cart/*"
  to = "/full-catalogue"
  status = 301

[[redirects]]
  from = "/checkout"
  to = "/full-catalogue"
  status = 301

# TEMPORARY — redirect gelitup.com to gelitup.eu while .com SSL cert is renewing
# Remove this block once gelitup.com is fully restored
[[redirects]]
  from = "https://gelitup.com/*"
  to = "https://gelitup.eu/:splat"
  status = 302
  force = true

# SPA catch-all — must remain last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
