name: Repopulate Zoho Item Map

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-zoho-item-map.mjs'
      - 'scripts/repopulate-zoho-item-map.mjs'
      - '.github/workflows/repopulate-item-map.yml'
  workflow_dispatch: {}

jobs:
  repopulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch item map from Zoho
        env:
          ZOHO_BOOKS_BASE_URL: ${{ secrets.ZOHO_BOOKS_BASE_URL }}
          ZOHO_BOOKS_ORGANIZATION_ID: ${{ secrets.ZOHO_BOOKS_ORGANIZATION_ID }}
          ZOHO_BOOKS_REFRESH_TOKEN: ${{ secrets.ZOHO_BOOKS_REFRESH_TOKEN }}
          ZOHO_BOOKS_CLIENT_ID: ${{ secrets.ZOHO_BOOKS_CLIENT_ID }}
          ZOHO_BOOKS_CLIENT_SECRET: ${{ secrets.ZOHO_BOOKS_CLIENT_SECRET }}
          ZOHO_ACCOUNTS_BASE_URL: ${{ secrets.ZOHO_ACCOUNTS_BASE_URL }}
        run: node scripts/fetch-zoho-item-map.mjs --output zoho-item-map.json

      - name: Repopulate Supabase zoho_item_map table
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/repopulate-zoho-item-map.mjs
