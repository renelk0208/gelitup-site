name: Daily Production Smoke

on:
  schedule:
    # 07:00 SAST (UTC+2) = 05:00 UTC every morning
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run public route smoke checks
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
        run: node scripts/predeploy-smoke.mjs ${{ secrets.SMOKE_BASE_URL || 'https://gelitup.com' }}

      - name: Run browser smoke check (public + registration + B2B portal + distributor portal)
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_DISTRIBUTOR_EMAIL: ${{ secrets.SMOKE_DISTRIBUTOR_EMAIL }}
          SMOKE_DISTRIBUTOR_PASSWORD: ${{ secrets.SMOKE_DISTRIBUTOR_PASSWORD }}
          SMOKE_B2B_EMAIL: ${{ secrets.SMOKE_B2B_EMAIL }}
          SMOKE_B2B_PASSWORD: ${{ secrets.SMOKE_B2B_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/smoke-e2e.mjs

      - name: Send failure alert email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.NOTIFY_SMTP_SERVER }}
          server_port: ${{ secrets.NOTIFY_SMTP_PORT }}
          username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          subject: "⚠️ GEL.IT.UP daily smoke check FAILED"
          to: rene@gelitup.com
          from: GEL.IT.UP Monitor <${{ secrets.NOTIFY_SMTP_USERNAME }}>
          body: |
            The daily production smoke check for gelitup.com has FAILED.

            Time: ${{ github.run_id }}
            View full logs and error details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Check the logs to see which page or route failed.
