name: Notify Admin — New B2B Registrations

# Runs every 15 minutes. If any new B2B registration was submitted in the last
# 16 minutes the admin receives an email with the applicant's details and a
# direct link to the admin dashboard to review and approve.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # allow manual trigger for testing

jobs:
  notify-pending:
    name: Notify admin of new B2B registrations
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Notify admin of new registrations
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTIFY_ADMIN_EMAIL:        ${{ secrets.NOTIFY_ADMIN_EMAIL }}
          NOTIFY_SMTP_SERVER:        ${{ secrets.NOTIFY_SMTP_SERVER }}
          NOTIFY_SMTP_PORT:          ${{ secrets.NOTIFY_SMTP_PORT }}
          NOTIFY_SMTP_USERNAME:      ${{ secrets.NOTIFY_SMTP_USERNAME }}
          NOTIFY_SMTP_PASSWORD:      ${{ secrets.NOTIFY_SMTP_PASSWORD }}
        run: node scripts/auto-approve-b2b.mjs

      - name: Alert on failure
        if: failure() && secrets.NOTIFY_ADMIN_EMAIL != '' && secrets.NOTIFY_SMTP_SERVER != '' && secrets.NOTIFY_SMTP_PORT != '' && secrets.NOTIFY_SMTP_USERNAME != '' && secrets.NOTIFY_SMTP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.NOTIFY_SMTP_SERVER }}
          server_port:    ${{ secrets.NOTIFY_SMTP_PORT }}
          username:       ${{ secrets.NOTIFY_SMTP_USERNAME }}
          password:       ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          subject:        "⚠️ GEL.IT.UP B2B notification job FAILED"
          to:             ${{ secrets.NOTIFY_ADMIN_EMAIL }}
          from:           "GEL.IT.UP Monitor <${{ secrets.NOTIFY_SMTP_USERNAME }}>"
          body: |
            The B2B registration notification job failed.

            View logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
