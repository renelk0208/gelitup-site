<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compliance & Certification</title>
  <meta name="description" content="Choose between GEL.IT.UP or Leeukopf compliance and certification information.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f8f8f6;
      color: #1a1a1a;
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 40px;
      font-weight: 400;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (max-width: 500px) {
      .choice-grid {
        grid-template-columns: 1fr;
      }
    }

    .choice-card {
      background: white;
      border-radius: 8px;
      padding: 30px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-decoration: none;
      color: #1a1a1a;
      transition: all 0.3s ease;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .choice-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(212, 55, 144, 0.15);
      border-color: #D43790;
    }

    .choice-card:active {
      transform: translateY(-2px);
    }

    .choice-icon {
      font-size: 40px;
      margin-bottom: 16px;
    }

    .choice-card h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .choice-card p {
      font-size: 13px;
      color: #666;
      font-weight: 400;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #999;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Compliance & Certification</h1>
    <p class="subtitle">Select your brand</p>

    <div class="choice-grid">
      <a href="/gelitup-compliance-certification.html" class="choice-card">
        <div class="choice-icon">💅</div>
        <h2>GEL.IT.UP</h2>
        <p>Professional gel polish compliance and certification</p>
      </a>

      <a href="https://www.leeukopf.com/compliance" class="choice-card">
        <div class="choice-icon">🌿</div>
        <h2>Leeukopf</h2>
        <p>Skincare and beauty compliance information</p>
      </a>
    </div>
  </div>

  <div class="footer">
    <p>Scanned from QR code • Choose your destination above</p>
  </div>
</body>
</html>
