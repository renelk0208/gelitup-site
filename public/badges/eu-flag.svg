<?xml version="1.0" encoding="UTF-8"?>
<!-- Official flag of the European Union: 12 gold five-pointed stars, not touching, arranged
     in a circle on a blue background, as specified by the Council of Europe / EU institutions. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 540" width="810" height="540" role="img" aria-label="Flag of the European Union">
  <rect width="810" height="540" fill="#003399" />
  <defs>
    <g id="eu-star" fill="#FFCC00">
      <!-- 12 stars arranged in a circle, each rotated to point outward from the centre -->
      <polygon points="0,-36 8.46,-11.13 34.24,-11.13 13.39,4.25 21.85,29.13 0,13.75 -21.85,29.13 -13.39,4.25 -34.24,-11.13 -8.46,-11.13" />
    </g>
  </defs>
  <use href="#eu-star" x="405" y="117" />
  <use href="#eu-star" x="477.5" y="135.5" />
  <use href="#eu-star" x="528" y="187" />
  <use href="#eu-star" x="549" y="257" />
  <use href="#eu-star" x="528" y="327" />
  <use href="#eu-star" x="477.5" y="378.5" />
  <use href="#eu-star" x="405" y="397" />
  <use href="#eu-star" x="332.5" y="378.5" />
  <use href="#eu-star" x="282" y="327" />
  <use href="#eu-star" x="261" y="257" />
  <use href="#eu-star" x="282" y="187" />
  <use href="#eu-star" x="332.5" y="135.5" />
</svg>
